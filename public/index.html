<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Timetable Application</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f6f9; color: #333; }
        .screen { display: none; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 15px; }
        .active { display: block; }
        .grid-timetable { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-top: 15px; }
        .day-column { background: #eef1f6; padding: 10px; border-radius: 6px; min-height: 300px; }
        .day-header { font-weight: bold; text-align: center; border-bottom: 2px solid #ccc; padding-bottom: 5px; margin-bottom: 10px; }
        .card { padding: 8px; margin-bottom: 8px; border-radius: 4px; color: white; font-size: 13px; }
        .status-confirmed { background: #000000; }
        .status-proposed { background: #f1c40f; color: #000; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; }
        select, input, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #2980b9; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; margin-right: 5px; }
        button.secondary { background: #7f8c8d; }
        .navbar { display: flex; gap: 10px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <h2>Weekly Timetable System</h2>
    <div id="userBadge" style="font-weight: bold; margin-bottom: 10px;"></div>

    <!-- Login Screen -->
    <div id="screen-login" class="screen active">
        <h3>Enter Passcode</h3>
        <input type="password" id="login-passcode" placeholder="Enter password...">
        <button onclick="handleLogin()" style="margin-top:10px;">Submit</button>
    </div>

    <!-- Admin Navigation Links Menu -->
    <div id="admin-nav" class="navbar" style="display:none;">
        <button onclick="switchScreen('screen-overview-admin')">Overview</button>
        <button onclick="openInputScreen()">Input Appointment</button>
        <button onclick="openModifyScreen()">Modify Appointment</button>
        <button onclick="switchScreen('screen-password')">Change Password</button>
        <button onclick="switchScreen('screen-export')">Export System</button>
        <button onclick="location.reload()" class="secondary">Logout</button>
    </div>

    <!-- Function 1a: Public Overview -->
    <div id="screen-overview-public" class="screen">
        <h3>Public Timetable Overview</h3>
        <div class="grid-timetable" id="timetable-public"></div>
    </div>

    <!-- Function 1b: Admin Overview -->
    <div id="screen-overview-admin" class="screen">
        <h3>Admin Timetable Dashboard</h3>
        <div class="form-group" style="width: 200px;">
            <label>Filter Category:</label>
            <select id="admin-filter-cat" onchange="loadAdminTimetable()">
                <option value="all">all</option>
                <option value="music">music</option>
                <option value="work">work</option>
                <option value="personal">personal</option>
                <option value="others">others</option>
            </select>
        </div>
        <div class="grid-timetable" id="timetable-admin"></div>
    </div>

    <!-- Function 2: Input Screen -->
    <div id="screen-input" class="screen">
        <h3>Input New Appointment</h3>
        <div class="form-group">
            <label>Category</label>
            <select id="in-cat"><option value="music">music</option><option value="work">work</option><option value="personal">personal</option><option value="others">others</option></select>
        </div>
        <div class="form-group">
            <label>Status</label>
            <select id="in-status"><option value="confirmed">confirmed</option><option value="proposed">proposed</option><option value="cancelled">cancelled</option></select>
        </div>
        <div class="form-group">
            <label>Date</label>
            <input type="date" id="in-date">
        </div>
        <div class="form-group">
            <label>Begin Time (Hour / Minute)</label>
            <select id="in-b-hr" style="width:48%; display:inline;"></select>
            <select id="in-b-min" style="width:48%; display:inline;"></select>
        </div>
        <div class="form-group">
            <label>End Time (Hour / Minute)</label>
            <select id="in-e-hr" style="width:48%; display:inline;"></select>
            <select id="in-e-min" style="width:48%; display:inline;"></select>
        </div>
        <div class="form-group">
            <label>Details (Max 500 Characters)</label>
            <textarea id="in-details" maxlength="500" rows="4"></textarea>
        </div>
        <button onclick="submitAppointment()">Submit Data</button>
        <button class="secondary" onclick="switchScreen('screen-overview-admin')">Back</button>
    </div>

    <!-- Function 3: Modify Screen -->
    <div id="screen-modify" class="screen">
        <h3>Modify Existing Appointment</h3>
        <div class="form-group">
            <label>Select Appointment to Edit</label>
            <select id="mod-select" onchange="populateModifyFields()"></select>
        </div>
        <div id="modify-fields-container">
            <!-- Bound dynamic edit items copy logic inputs here -->
            <div class="form-group">
                <label>Category</label>
                <select id="mod-cat"><option value="music">music</option><option value="work">work</option><option value="personal">personal</option><option value="others">others</option></select>
            </div>
            <div class="form-group">
                <label>Status</label>
                <select id="mod-status"><option value="confirmed">confirmed</option><option value="proposed">proposed</option><option value="cancelled">cancelled</option></select>
            </div>
            <div class="form-group">
                <label>Date</label>
                <input type="date" id="mod-date">
            </div>
            <div class="form-group">
                <label>Begin Time</label>
                <select id="mod-b-hr" style="width:48%; display:inline;"></select>
                <select id="mod-b-min" style="width:48%; display:inline;"></select>
            </div>
            <div class="form-group">
                <label>End Time</label>
                <select id="mod-e-hr" style="width:48%; display:inline;"></select>
                <select id="mod-e-min" style="width:48%; display:inline;"></select>
            </div>
            <div class="form-group">
                <label>Details</label>
                <textarea id="mod-details" maxlength="500" rows="4"></textarea>
            </div>
            <button onclick="saveModification()">Save Changes</button>
            <button class="secondary" onclick="switchScreen('screen-overview-admin')">Back</button>
        </div>
    </div>

    <!-- Function 4: Password Administration -->
    <div id="screen-password" class="screen">
        <h3>Change Account Password</h3>
        <div class="form-group">
            <label>PassType</label>
            <select id="pw-type"><option value="admin">admin</option><option value="public">public</option></select>
        </div>
        <div class="form-group">
            <label>Old Value</label>
            <input type="password" id="pw-old">
        </div>
        <div class="form-group">
            <label>New Value</label>
            <input type="password" id="pw-new">
        </div>
        <div class="form-group">
            <label>Confirm New Value</label>
            <input type="password" id="pw-confirm">
        </div>
        <button onclick="updatePassword()">Update Password</button>
        <button class="secondary" onclick="returnToDashboard()">Back</button>
    </div>

    <!-- Function 5: Data Export Configuration -->
    <div id="screen-export" class="screen">
        <h3>Export Database Records</h3>
        <p>Click below to download all recorded items as an active spreadsheet document format.</p>
        <button onclick="window.open('/api/export')">Download tbl_appointment.xlsx</button>
    </div>

    <script src="app.js"></script>
</body>
</html>

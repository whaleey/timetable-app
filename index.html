<!-- Locate your #admin-menu div inside index.html and append this button -->
<div id="admin-menu" class="admin-nav hidden">
    <!-- Existing buttons remain... -->
    <button onclick="openStudentsView()">Students</button>
</div>

<!-- Paste this container directly underneath your #view-list container markup block -->
<div id="view-students" class="screen">
    <h3>Student Management</h3>
    <div style="overflow-x:auto; background:white; border:1px solid #ddd; margin-top:10px; max-width:500px;">
        <table id="students-table" style="width:100%; border-collapse:collapse; text-align:left; font-size:14px;">
            <thead>
                <tr style="background:#eee;">
                    <th style="padding:8px; border-bottom:1px solid #ddd;">Student ID</th>
                    <th style="padding:8px; border-bottom:1px solid #ddd;">Student Name</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    
    <!-- Add New Entry Input Form Row Section Matrix -->
    <div style="margin-top:20px; padding:15px; background:#f1f1f1; border-radius:4px; max-width:500px;">
        <h4 style="margin-bottom:10px;">Add New Student Entry</h4>
        <form id="student-form" onsubmit="submitNewStudent(event)">
            <div class="form-group">
                <label for="stud-new-name">Student Name*</label>
                <input type="text" id="stud-new-name" placeholder="Enter Full Student Name" required>
            </div>
            <button type="submit" class="btn" style="margin-top:5px;">Save</button>
            <button type="button" class="btn btn-secondary" onclick="switchScreen('view-overview-admin')" style="margin-top:5px;">Back</button>
        </form>
    </div>
</div>
